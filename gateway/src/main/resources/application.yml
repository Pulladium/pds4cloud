server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:jobsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: spring-gateway
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/pds4cloud
          # Optional: explicit JWK set URI (usually auto-discovered)
          # jwk-set-uri: http://localhost:8484/realms/pds4cloud/protocol/openid-connect/certs

security:
  enabled: ${SECURITY_ENABLED:false}

keycloak:
  client-id: react-client-certedu-api

logging:
  level:
    JWT.DEBUG: INFO
    org.springframework.security: DEBUG
