server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/admin/minio {
        return 302 /admin/minio;
    }

    location = /api/admin/minio/ {
        return 302 /admin/minio;
    }

    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass http://minio:9001/static/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
        proxy_buffering off;
    }

    location /styles/ {
        proxy_pass http://minio:9001/styles/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
        proxy_buffering off;
    }

    location /api/v1/ {
        proxy_pass http://minio:9001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://minio:9001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
        proxy_set_header Origin http://minio:9001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /favicon.ico {
        proxy_pass http://minio:9001/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9001;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location = /keycloak/admin {
        return 308 /keycloak/admin/;
    }

    location /keycloak/admin/ {
        rewrite ^/keycloak/admin/(.*)$ /admin/$1 break;
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /admin/master/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /js/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location /mars2020/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
